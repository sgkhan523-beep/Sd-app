<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFFCO S&amp;D</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#de2312"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="IFFCO S&D"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#0f2238;--muted:#5b6b7c;--line:#dce2e9;--accent:#c41e0f;--on-accent:#fff;--brand:#de2312;--danger:#b3261e;--danger-bg:#fde8e6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--surface:#16222f;--ink:#eaf0f6;--muted:#9fb0c2;--line:#2a3a4b;--accent:#ff7b6e;--on-accent:#1a0805;--brand:#de2312;--danger:#ff8a80;--danger-bg:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--surface:#16222f;--ink:#eaf0f6;--muted:#9fb0c2;--line:#2a3a4b;--accent:#ff7b6e;--on-accent:#1a0805;--brand:#de2312;--danger:#ff8a80;--danger-bg:#3a1c1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--brand);color:#fff;padding:10px 12px 10px;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.r1{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
#q:focus,#cat:focus,#fam:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
#scanbtn{padding:0 18px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.r2{display:flex;gap:8px;margin-top:8px}#cat,#fam{flex:1;min-width:0;font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
#info{color:var(--muted);font-size:13px;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:var(--line)}
.th{width:58px;height:58px;flex:none;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.ph{background:var(--bg)}
.nw{flex:1;min-width:0}.nm{font-weight:600;line-height:1.25}
.meta{color:var(--muted);font-size:12.5px}
.pr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.p1{font-size:18px;font-weight:700}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--danger-bg);color:var(--danger);font-weight:600;font-size:12px}
#detail,#scan{position:fixed;inset:0;z-index:40}
#detail{background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#back{position:sticky;top:0;display:block;width:100%;text-align:left;padding:14px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:16px}
.ph1{background:#fff;text-align:center;padding:10px}.ph1 img{max-width:100%;max-height:280px;object-fit:contain}
.nophoto{padding:34px;color:var(--muted);text-align:center;background:var(--surface)}
.body{padding:14px 14px 40px;max-width:640px;margin:auto}
h1{font-size:20px;line-height:1.25;margin:0 0 6px}
.warn{background:var(--danger-bg);color:var(--danger);font-weight:700;padding:8px 12px;border-radius:8px;margin:8px 0}
.prices{display:flex;gap:8px;margin:12px 0}
.pb{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.pb b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.pb span{color:var(--muted);font-size:12.5px}
dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.bars{margin-top:14px}.bars svg{display:block;max-width:100%;background:#fff;border-radius:8px;margin:8px 0}
#scan{background:#000;color:#fff}
#v{width:100%;height:100%;object-fit:cover}
#sclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:10px 16px;border-radius:10px;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:700}
#sphoto{position:absolute;left:12%;right:12%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);text-align:center;padding:16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:18px}
#smsg{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;padding:12px;background:rgba(0,0,0,.65)}
.ret{position:absolute;left:10%;right:10%;top:34%;height:22%;border:3px solid #fff;border-radius:12px;opacity:.85;pointer-events:none}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.plate{background:#fff;border-radius:10px;padding:6px 12px;display:flex}.plate img{height:30px;width:auto;display:block}
.ttl{font-weight:700;font-size:15px;letter-spacing:.4px}
header #q,header #cat,header #fam{background:#fff;color:#0f2238;border:0}
header #q:focus,header #cat:focus,header #fam:focus{outline:3px solid #fff;outline-offset:1px}
header #scanbtn{background:#10243e;color:#fff}
header #info{color:rgba(255,255,255,.92)}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px 0;border-radius:99px;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;font-weight:600}
.seg button.on{background:#fff;color:#b3180c;border-color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:14px 12px;cursor:pointer;min-height:68px}
.tile:active{background:var(--line)}.tile b{display:block;font-size:16px}.tile span{color:var(--muted);font-size:13px}
.crumb{padding:12px 14px;background:var(--surface);color:var(--accent);font-weight:700;border-bottom:1px solid var(--line);cursor:pointer}
.famh{padding:10px 14px 6px;font-weight:800;font-size:14px;color:var(--accent);background:var(--bg);border-bottom:2px solid var(--brand);position:sticky;top:0;z-index:2}.famh span{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}

.cim i{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(12px) saturate(1.1);opacity:.9}
.cim img{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.tile.pic{padding:0;overflow:hidden}.tile.pic .tx{padding:8px 12px 10px}
.cban{height:150px}
.badge.promo{background:#ffd96b;color:#3d2a00}
.star{border:0;background:transparent;font-size:24px;color:var(--brand);padding:6px 4px;line-height:1;margin-left:2px}
.star.on{color:#e0a800}#favbtn,.star,[data-do="fav"]{display:none!important}
.th.ic{display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--bg)}
.r3{display:flex;gap:6px;margin-top:6px}.r3 button{flex:1;padding:7px 0;border-radius:99px;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;font-weight:600}
.r3 button.on{background:#fff;color:#b3180c;border-color:#fff}
.acts{display:flex;gap:8px;margin:10px 0}
.abtn{flex:1;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.abtn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;width:100%;margin-top:8px}
.abtn.wa{background:#1fa855;color:#fff;border-color:transparent}
.ordbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.orow{display:flex;gap:8px;margin-top:8px;align-items:center}
.sq{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;font-weight:700}
#oq,#ord .oq{width:76px;font:inherit;font-size:18px;padding:10px;text-align:center;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
#ou,#ord .ou{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
dd.copy{color:var(--accent);text-decoration:underline dotted;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:80;font-weight:600}
#zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
#zoom img{max-width:100%;max-height:100%;background:#fff;object-fit:contain}
#ord{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#oback{position:sticky;top:0;display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:16px}
.oline{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.ol1{flex:1;min-width:0}.rm{border:0;background:transparent;color:var(--danger);font-size:20px;padding:6px}
#otot{font-weight:700;margin:12px 0}.oacts{display:grid;gap:8px}
#asr{position:fixed;inset:0;z-index:46;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#aback{position:sticky;top:0;z-index:3;display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:16px}
.ainp{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px}
.aflt{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}.ahow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.ahow .abtn{margin-top:0;padding:9px 6px;font-size:14px}
.oosb{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 10px;font-weight:600;font-size:13px}.oosb.on{background:var(--danger);border-color:var(--danger);color:#fff}.oosrow{border-color:var(--danger);background:var(--danger-bg)}
.astore{cursor:pointer}.acnt{color:var(--accent);white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.prow.on{border-color:var(--brand);background:#fdecea}.chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#fff}
.prow.on .chk{background:var(--brand);border-color:var(--brand)}
.adone{position:sticky;bottom:0;padding:10px 0;background:var(--bg)}
.abtn:disabled{opacity:.5}
.cp{color:var(--accent);text-decoration:underline dotted;cursor:pointer}
.oline .conv{font-weight:600;color:var(--ink)}

/* offline EAN-13 / UPC-A photo decoder */
var EAN_L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"],
EAN_G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"],
EAN_R=["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"],
EAN_P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function bitsRuns(b){var r=[],c=b[0],n=0;for(var i=0;i<b.length;i++){if(b[i]===c)n++;else{r.push(n);c=b[i];n=1}}r.push(n);return r}
var EAN_T=(function(){var t=[];for(var d=0;d<10;d++){t.push({d:d,k:"L",w:bitsRuns(EAN_L[d])},{d:d,k:"G",w:bitsRuns(EAN_G[d])},{d:d,k:"R",w:bitsRuns(EAN_R[d])})}return t})();
function eanDigit(r,i,right){var T=r[i]+r[i+1]+r[i+2]+r[i+3];if(T<=0)return null;var best=null,be=1e9;
 for(var k=0;k<EAN_T.length;k++){var p=EAN_T[k];if(right?p.k!=="R":p.k==="R")continue;var e=0;for(var j=0;j<4;j++){var x=7*r[i+j]/T-p.w[j];e+=x*x}if(e<be){be=e;best=p}}
 return be<1.5?{d:best.d,k:best.k,T:T,e:be}:null}
function eanRuns(r){/* r = array of run widths starting with a dark run; try every start */
 for(var s=0;s+58<r.length;s+=2){var a=r[s],b=r[s+1],c=r[s+2],m=(a+b+c)/3;
  if(m<1.2||Math.abs(a-m)>m*.55||Math.abs(b-m)>m*.55||Math.abs(c-m)>m*.55)continue;
  var ok=true,L=[],par="",i=s+3;
  for(var q=0;q<6;q++,i+=4){var x=eanDigit(r,i,false);if(!x||x.T<5*m||x.T>9.5*m){ok=false;break}L.push(x.d);par+=x.k}
  if(!ok)continue;var f=EAN_P.indexOf(par);if(f<0)continue;
  var cm=0;for(var z=0;z<5;z++)cm+=r[i+z];if(cm<3.5*m||cm>6.7*m)continue;i+=5;
  var Rr=[];for(var q2=0;q2<6;q2++,i+=4){var y=eanDigit(r,i,true);if(!y||y.T<5*m||y.T>9.5*m){ok=false;break}Rr.push(y.d)}
  if(!ok)continue;
  var dg=[f].concat(L,Rr),sum=0;for(var n=0;n<12;n++)sum+=dg[n]*(n%2?3:1);
  if((10-sum%10)%10!==dg[12])continue;return dg.join("")}
 return null}
function eanLine(sig,k){var n=sig.length,pre=new Float64Array(n+1),mn=255,mx=0,i;for(i=0;i<n;i++){pre[i+1]=pre[i]+sig[i];if(sig[i]<mn)mn=sig[i];if(sig[i]>mx)mx=sig[i]}
 if(mx-mn<40)return null;var W=Math.max(40,Math.round(n/9)),bits=new Uint8Array(n);
 for(i=0;i<n;i++){var a=Math.max(0,i-W),b=Math.min(n,i+W),mean=(pre[b]-pre[a])/(b-a);bits[i]=sig[i]<mean+k*(mx-mn)?1:0}
 var runs=[],c=bits[0],cnt=0;for(i=0;i<n;i++){if(bits[i]===c)cnt++;else{runs.push([c,cnt]);c=bits[i];cnt=1}}runs.push([c,cnt]);
 if(runs.length<59)return null;
 var arr=[],start=runs[0][0]===1?0:1;for(i=start;i<runs.length;i++)arr.push(runs[i][1]);
 var res=eanRuns(arr);if(res)return res;
 var rev=arr.slice().reverse();if((arr.length-1)%2!==0)rev.shift();return eanRuns(rev)}
function decodeCanvasData(g,w,h,valid){var diag=Math.sqrt(w*w+h*h),cx=w/2,cy=h/2,angs=[0,90,-8,8,82,98,-16,16,74,106,-25,25,65,115,-35,35],hits={};
 var nl=Math.max(30,Math.min(90,Math.round(Math.min(w,h)/10)));
 for(var ai=0;ai<angs.length;ai++){var th=angs[ai]*Math.PI/180,dx=Math.cos(th),dy=Math.sin(th),nx=-dy,ny=dx;
  var ext=(Math.abs(nx)*w+Math.abs(ny)*h)/2;
  for(var li=0;li<nl;li++){var t=-ext*.95+(2*ext*.95)*(li+.5)/nl,sig=[];
   for(var s=-diag/2;s<diag/2;s+=1){var x=cx+nx*t+dx*s,y=cy+ny*t+dy*s;if(x<0||y<0||x>=w-1||y>=h-1)continue;
    var x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,o=y0*w+x0;sig.push(g[o]*(1-fx)*(1-fy)+g[o+1]*fx*(1-fy)+g[o+w]*(1-fx)*fy+g[o+w+1]*fx*fy)}
   if(sig.length<120)continue;
   var sm=new Float32Array(sig.length);for(var q=0;q<sig.length;q++){sm[q]=(sig[Math.max(0,q-1)]+2*sig[q]+sig[Math.min(sig.length-1,q+1)])/4}
   var ks=[0,-.07,.07];for(var ki=0;ki<ks.length;ki++){var r=eanLine(sm,ks[ki]);if(r&&valid&&!valid(r))r=null;if(r){hits[r]=(hits[r]||0)+1;if(hits[r]>=2)return{c:r,n:hits[r]};break}}}}
 var best=null,bc=0;for(var kk in hits)if(hits[kk]>bc){bc=hits[kk];best=kk}return best?{c:best,n:bc}:null}
function decodePhoto(img,valid){var sizes=[1600,2600,1000],single=null;
 for(var si=0;si<sizes.length;si++){var sc=Math.min(1,sizes[si]/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),w=Math.round((img.naturalWidth||img.width)*sc),h=Math.round((img.naturalHeight||img.height)*sc);
  var cv=document.createElement("canvas");cv.width=w;cv.height=h;var cx=cv.getContext("2d");cx.drawImage(img,0,0,w,h);var d=cx.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  for(var i=0,j=0;i<d.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  var r=decodeCanvasData(g,w,h,valid);if(r){if(r.n>=2)return r.c;if(!single)single=r.c}}
 return single}
